# Enhanced Network Security Configuration for Ubuntu 24.04
# Complements system 10-network-security.conf
# Uses 30- prefix to load after system defaults
# Compatible with existing Ubuntu 24.04 security settings

##########################################################################################
## IP Forwarding and Routing Security (Enhanced)
##########################################################################################

# Disable IP forwarding (will be enabled by specific services if needed)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# Disable source routing (prevents routing manipulation)
net.ipv4.conf.all.accept_source_route = 0
net.ipv4.conf.default.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv6.conf.default.accept_source_route = 0

# Disable redirects (prevents routing manipulation)
net.ipv4.conf.all.accept_redirects = 0
net.ipv4.conf.default.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv6.conf.default.accept_redirects = 0

# Disable sending redirects
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.default.send_redirects = 0

##########################################################################################
## ICMP Security (Enhanced)
##########################################################################################

# Ignore ICMP ping requests (reduces attack surface)
net.ipv4.icmp_echo_ignore_all = 1

# Ignore broadcast ping requests
net.ipv4.icmp_echo_ignore_broadcasts = 1

# Ignore bogus ICMP error responses
net.ipv4.icmp_ignore_bogus_error_responses = 1

##########################################################################################
## TCP Security (Enhanced)
##########################################################################################

# Enable TCP SYN cookies (protection against SYN flood attacks)
net.ipv4.tcp_syncookies = 1

# TCP SYN handling (balance between security and compatibility)
net.ipv4.tcp_syn_retries = 3
net.ipv4.tcp_synack_retries = 2
net.ipv4.tcp_max_syn_backlog = 2048

# TCP keepalive settings (detect dead connections)
net.ipv4.tcp_keepalive_time = 600
net.ipv4.tcp_keepalive_intvl = 60
net.ipv4.tcp_keepalive_probes = 3

# Enable TCP window scaling
net.ipv4.tcp_window_scaling = 1

# Enable selective acknowledgements
net.ipv4.tcp_sack = 1

# Enable timestamps
net.ipv4.tcp_timestamps = 1

# Protect against time-wait assassination
net.ipv4.tcp_rfc1337 = 1

##########################################################################################
## Network Buffer and Connection Limits (Enhanced)
##########################################################################################

# Increase network buffer sizes for better performance
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 65536 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216

# Maximum number of connections
net.core.somaxconn = 1024
net.core.netdev_max_backlog = 2000

##########################################################################################
## ARP Security (Enhanced)
##########################################################################################

# ARP security settings
net.ipv4.conf.all.arp_filter = 1
net.ipv4.conf.all.arp_announce = 2
net.ipv4.conf.all.arp_ignore = 1

##########################################################################################
## IPv6 Security (Enhanced)
##########################################################################################

# Disable IPv6 router advertisements
net.ipv6.conf.all.accept_ra = 0
net.ipv6.conf.default.accept_ra = 0

# Disable IPv6 router solicitations
net.ipv6.conf.all.router_solicitations = 0
net.ipv6.conf.default.router_solicitations = 0

# Disable IPv6 autoconfiguration
net.ipv6.conf.all.autoconf = 0
net.ipv6.conf.default.autoconf = 0

##########################################################################################
## Kernel Security Settings (Enhanced)
##########################################################################################

# Kernel security settings
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2
kernel.yama.ptrace_scope = 1

# Disable core dumps
kernel.core_pattern = |/bin/false

# Control shared memory
kernel.shmmax = 268435456
kernel.shmall = 268435456

##########################################################################################
## File System Security (Enhanced)
##########################################################################################

# Filesystem security
fs.suid_dumpable = 0
fs.protected_hardlinks = 1
fs.protected_symlinks = 1

##########################################################################################
## Note: Reverse Path Filtering
##########################################################################################
# 
# Ubuntu 24.04 system default 10-network-security.conf sets:
# net.ipv4.conf.default.rp_filter=2
# net.ipv4.conf.all.rp_filter=2
#
# This uses "loose mode" (2) which provides security while maintaining
# compatibility with complex networking setups. We preserve this setting
# rather than overriding to strict mode (1) which could break legitimate
# networking configurations.
#
# rp_filter modes:
# 0 = Disabled (no filtering)
# 1 = Strict mode (packets must arrive on expected interface)  
# 2 = Loose mode (packets allowed if route exists - UBUNTU DEFAULT)
# 