# WireGuard VPN IP Forwarding Configuration for Ubuntu 24.04
# Uses 40- prefix to load after enhanced network security settings
# Enables IP forwarding required for VPN routing

##########################################################################################
## IP Forwarding for WireGuard VPN
##########################################################################################

# Enable IPv4 forwarding for VPN routing
net.ipv4.ip_forward = 1

# Enable IPv6 forwarding for VPN routing (if IPv6 VPN is needed)
net.ipv6.conf.all.forwarding = 1

##########################################################################################
## Additional VPN-Optimized Settings
##########################################################################################

# Increase connection tracking table size for VPN connections
# (Only applied if netfilter connection tracking is loaded)
net.netfilter.nf_conntrack_max = 131072

# Optimize network buffers for VPN traffic
net.core.netdev_max_backlog = 5000

# TCP settings optimized for VPN tunnels
net.ipv4.tcp_mtu_probing = 1

##########################################################################################
## Note: Load Order
##########################################################################################
#
# This file loads after:
# - 10-network-security.conf (Ubuntu system defaults)
# - 30-enhanced-network-security.conf (our security enhancements)
#
# The 40- prefix ensures VPN requirements override security defaults
# where necessary (specifically IP forwarding) while maintaining
# all other security hardening.
# 