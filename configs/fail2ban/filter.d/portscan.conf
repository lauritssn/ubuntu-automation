# Fail2Ban filter for port scanning detection
# This filter detects various port scanning and suspicious network activity
# Compatible with Ubuntu 24.04 and iptables-nft
#
# Author: Ubuntu Automation Project
# Date: 2024
#

[INCLUDES]
# Read common prefixes if available
before = common.conf

[Definition]

# Failregex patterns for port scanning detection
# Matches custom PORTSCAN log entries from iptables rules
failregex = ^.* kernel:.*PORTSCAN:.*SRC=<HOST>.*$
            ^.* kernel:.*NMAP_SCAN:.*SRC=<HOST>.*$
            ^.* kernel:.*SYN_FLOOD:.*SRC=<HOST>.*$
            ^.* kernel:.*PORT_PROBE:.*SRC=<HOST>.*$
            ^.* kernel:.*STEALTH_SCAN:.*SRC=<HOST>.*$

# Alternative patterns for different scanning types
            ^.* kernel:.*IN=.*SRC=<HOST>.*DPT=.*flags.*FIN.*$
            ^.* kernel:.*IN=.*SRC=<HOST>.*DPT=.*flags.*NULL.*$
            ^.* kernel:.*IN=.*SRC=<HOST>.*DPT=.*flags.*XMAS.*$

# Ignore legitimate traffic patterns
ignoreregex = ^.* kernel:.*IN=.*SRC=<HOST>.*DPT=(22|80|443|51820).*flags.*ACK.*$
              ^.* kernel:.*OUT=.*DST=<HOST>.*$

[Init]
# Maximum number of log lines to buffer for analysis
maxlines = 20

# Allow IPv6 addresses to be detected and banned
allowipv6 = auto

# Journal match for systemd (Ubuntu 24.04)
journalmatch = _TRANSPORT=kernel

# Date pattern (optional, fail2ban will auto-detect)
datepattern = {^LN-BEG} 