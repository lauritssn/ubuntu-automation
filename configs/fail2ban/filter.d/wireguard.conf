# Fail2Ban filter for WireGuard VPN
# This filter detects various WireGuard authentication and connection failures
#
# Author: Ubuntu Automation Project
# Date: 2024
#

[INCLUDES]
# Read common prefixes if available
before = common.conf

[Definition]

# Failregex patterns for WireGuard
failregex = ^.* kernel:.*wireguard.*: Invalid handshake initiation from <HOST>.*$
            ^.* kernel:.*wireguard.*: Handshake for peer .* did not complete after .* seconds, retrying \(tried .* times\).*from <HOST>.*$
            ^.* kernel:.*wireguard.*: Packet has unallowed src IP <HOST>.*$
            ^.* kernel:.*wireguard.*: Invalid MAC of handshake, dropping packet from <HOST>.*$
            ^.* kernel:.*wireguard.*: Packet is not from allowed IP <HOST>.*$
            ^.* wireguard.*: Invalid handshake from <HOST>.*$
            ^.* wireguard.*: Connection attempt from unauthorized IP <HOST>.*$

# Ignore successful connections and normal operations
ignoreregex = ^.* kernel:.*wireguard.*: Keypair .* created for peer .*$
              ^.* kernel:.*wireguard.*: Receiving keepalive packet from peer .*$
              ^.* kernel:.*wireguard.*: Sending keepalive packet to peer .*$

[Init]
# Maximum number of log lines to buffer for analysis
maxlines = 10

# Journal match for systemd (Ubuntu 24.04)
journalmatch = _SYSTEMD_UNIT=wireguard.service + _SYSTEMD_UNIT=wg-quick@.service

# Date pattern (optional, fail2ban will auto-detect)
datepattern = {^LN-BEG} 