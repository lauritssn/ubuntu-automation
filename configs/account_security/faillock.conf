# Ubuntu 24.04 faillock configuration
# Account lockout after 5 failed attempts, 10 minute lockout

# Number of failed attempts before lockout
deny = 5

# Lockout duration in seconds (600 = 10 minutes)
unlock_time = 600

# Enable audit logging
audit

# Also lock root account
even_deny_root

# Directory for lock files
dir = /var/run/faillock

# Fail interval (time window for counting failed attempts)
fail_interval = 900

# Enable local users only (don't affect LDAP users)
local_users_only