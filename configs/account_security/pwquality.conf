# Password quality requirements for Ubuntu 24.04
# Configuration file for pam_pwquality module

# Minimum password length
minlen = 12

# Require at least one digit
dcredit = -1

# Require at least one uppercase letter  
ucredit = -1

# Require at least one lowercase letter
lcredit = -1

# Require at least one special character (other)
ocredit = -1

# Maximum number of allowed consecutive characters
maxrepeat = 3

# Minimum number of character classes required
minclass = 3

# Check against dictionary words
dictcheck = 1

# Enforce password quality checks for root user
enforce_for_root

# Reject passwords that contain the user name in some form
usercheck = 1

# Maximum number of allowed same consecutive characters
maxsequence = 3

# Prompt user at most N times before returning with error
retry = 3