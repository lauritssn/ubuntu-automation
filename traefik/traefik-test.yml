# Define trusted IPs once
x-trusted-ips: &trusted-ips
  - "172.18.0.0/16"
  - "172.19.0.0/16"
  - "172.20.0.0/16"
  - "127.0.0.1/32"
  - "::1/128"
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

api:
  dashboard: true
  insecure: true # Allow HTTP dashboard access

ping: {}

# EntryPoints - addresses ignored when socket activation provides file descriptors
entryPoints:
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs: *trusted-ips
  traefik:
    address: ":8080"
    forwardedHeaders:
      trustedIPs: *trusted-ips

providers:
  # Dynamic configuration files
  file:
    directory: /etc/traefik/sites
    watch: true

metrics:
  prometheus:
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# Logging configuration
log:
  level: INFO

# Access logs
accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  fields:
    headers:
      defaultMode: keep
      names:
        User-Agent: keep
        Authorization: drop
        Content-Type: keep

global:
  checkNewVersion: false
  sendAnonymousUsage: false

# Experimental features - WASM plugin support
experimental:
  plugins:
    coraza:
      moduleName: github.com/jcchavezs/coraza-http-wasm-traefik
      version: v0.3.0
