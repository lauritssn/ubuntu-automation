# Define trusted IPs once
x-trusted-ips: &trusted-ips
  - "172.18.0.0/16"
  - "172.19.0.0/16"
  - "172.20.0.0/16"
  - "127.0.0.1/32"
  - "::1/128"

api:
  dashboard: true
  insecure: true # Allow HTTP dashboard access

ping:
  entryPoint: traefik

# EntryPoints - socket activation provides file descriptors, no address needed
entryPoints:
  web:
    forwardedHeaders:
      trustedIPs: *trusted-ips
  traefik:
    forwardedHeaders:
      trustedIPs: *trusted-ips

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik"

  # Dynamic configuration files
  file:
    directory: /etc/traefik/dynamic
    watch: true

log:
  level: DEBUG
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        Authorization: drop
        Cookie: drop
        Set-Cookie: drop

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
