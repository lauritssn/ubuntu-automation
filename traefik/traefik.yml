api:
  dashboard: true
  insecure: true

ping: {}

# EntryPoints are configured via environment variables for socket activation
# TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
# TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443  
# TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS=:8080

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik"

  # Dynamic configuration files
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "${LETSENCRYPT_EMAIL}" # Updated to use environment variable
      storage: /data/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: ${TRAEFIK_LOG_LEVEL:-INFO}

accessLog:
  format: json
  fields:
    defaultMode: keep
    names:
      ClientUsername: drop
    headers:
      defaultMode: keep
      names:
        Authorization: drop
        Cookie: drop
        Set-Cookie: drop

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
