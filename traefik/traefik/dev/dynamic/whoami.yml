http:
  routers:
    whoami-dev:
      rule: "Host(`whoami.localdev`)"
      service: "whoami-dev"
      entryPoints:
        - "web"
      priority: 90
      middlewares:
        - "dev-headers@file"
        - "dev-rate-limit@file"
        - "coraza-waf-dev@file"

  services:
    whoami-dev:
      loadBalancer:
        servers:
          - url: "http://whoami-dev:80"
        healthCheck:
          path: "/health"
          interval: "30s"
          timeout: "10s"
