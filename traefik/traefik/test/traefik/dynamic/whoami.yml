http:
  routers:
    whoami-test:
      rule: "Host(`whoami.localtest`)"
      service: "whoami-test"
      entryPoints:
        - "web"
      priority: 90
      middlewares:
        - "coraza-waf-test@file"
        - "test-headers@file"
        - "test-rate-limit@file"

  services:
    whoami-test:
      loadBalancer:
        servers:
          - url: "http://whoami-test:80"
        healthCheck:
          path: "/health"
          interval: "30s"
          timeout: "10s"
