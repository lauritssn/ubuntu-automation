# =============================================================================
# WHOAMI PRODUCTION SERVICE CONFIGURATION
# =============================================================================

# Define domain configuration - UPDATE THIS VALUE FOR YOUR SETUP
x-whoami-domain: &whoami-domain "whoami.yourdomain.com"

http:
  routers:
    # Redirect HTTP to HTTPS
    whoami-prod-redirect:
      rule: &whoami-rule-http "Host(`whoami.yourdomain.com`)"
      entryPoints:
        - "web"
      middlewares:
        - "redirect-to-https"
      service: "whoami-prod"
      priority: 90

    # HTTPS service with enhanced security
    whoami-prod:
      rule: &whoami-rule-https "Host(`whoami.yourdomain.com`)"
      service: "whoami-prod"
      entryPoints:
        - "websecure"
      priority: 90
      middlewares:
        - "coraza-waf@file" # WAF protection
        - "security-headers@file" # Security headers
        - "rate-limit@file" # Rate limiting
        - "compress@file" # Compression
      tls:
        certResolver: "letsencrypt"
        options: "modern@file" # Use modern TLS configuration

  middlewares:
    redirect-to-https:
      redirectScheme:
        scheme: https
        permanent: true

  services:
    whoami-prod:
      loadBalancer:
        servers:
          - url: "http://whoami-prod:80"
        # SECURITY: Enhanced health check configuration
        healthCheck:
          path: "/"
          interval: "30s"
          timeout: "5s"
          scheme: "http"
          mode: "http"
          headers:
            Host: *whoami-domain
