# =============================================================================
# CONFIGURATION VARIABLES
# =============================================================================

# Define trusted IPs for forwarded headers
x-trusted-ips: &trusted-ips
  - "172.18.0.0/16"
  - "172.19.0.0/16"
  - "172.20.0.0/16"
  - "127.0.0.1/32"
  - "::1/128"
  # Cloudflare IPs for production (keep updated regularly)
  - "173.245.48.0/20"
  - "103.21.244.0/22"
  - "103.22.200.0/22"
  - "103.31.4.0/22"
  - "141.101.64.0/18"
  - "108.162.192.0/18"
  - "190.93.240.0/20"
  - "188.114.96.0/20"
  - "197.234.240.0/22"
  - "198.41.128.0/17"
  - "162.158.0.0/15"
  - "104.16.0.0/13"
  - "104.24.0.0/14"
  - "172.64.0.0/13"
  - "131.0.72.0/22"
  - "2400:cb00::/32"
  - "2606:4700::/32"
  - "2803:f800::/32"
  - "2405:b500::/32"
  - "2405:8100::/32"
  - "2a06:98c0::/29"
  - "2c0f:f248::/32"

# SECURITY: Disable dashboard in production or secure it properly
api:
  dashboard: false # Changed from true - disable in production
  # If you need dashboard, secure it with proper authentication:
  # dashboard: true
  insecure: false

ping:
  entryPoint: "internal"

# EntryPoints - socket activation provides file descriptors, no address needed
entryPoints:
  web:
    address: ":80"
    # SECURITY: Add automatic HTTPS redirect
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
    forwardedHeaders:
      trustedIPs: *trusted-ips
      insecure: false # SECURITY: Only trust specified IPs
  websecure:
    address: ":443"
    forwardedHeaders:
      trustedIPs: *trusted-ips
      insecure: false # SECURITY: Only trust specified IPs
    http:
      # SECURITY: Add security headers middleware
      middlewares:
        - security-headers@file
        - rate-limit@file
      # SECURITY: TLS configuration
      tls:
        options: modern@file
  traefik:
    address: ":8080"
    forwardedHeaders:
      trustedIPs: *trusted-ips
      insecure: false
    # SECURITY: Secure dashboard access if enabled
    # http:
    #   middlewares:
    #     - dashboard-auth@file
  internal:
    address: "127.0.0.1:9000" # Internal healthcheck port - localhost only

providers:
  # Dynamic configuration files
  file:
    directory: /etc/traefik/sites
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: "tools@werktoej.dk"
      storage: /data/acme.json

      # SECURITY: HTTP challenge disabled in favor of DNS challenge
      # HTTP challenge requires port 80 to be accessible from the internet
      # and cannot generate wildcard certificates
      # httpChallenge:
      #   entryPoint: web

      # SECURITY: Use DNS challenge with Cloudflare for better security and wildcard support
      # Benefits:
      # - Works behind firewalls/NAT (no need for port 80 exposure)
      # - Supports wildcard certificates (*.domain.com)
      # - Higher rate limits from Let's Encrypt
      # - More secure as no HTTP endpoint needed
      dnsChallenge:
        provider: cloudflare
        propagation:
          # Wait before checking DNS propagation (Traefik 3.1+ syntax)
          # Increase if you experience DNS propagation delays
          delayBeforeChecks: "60s"
        resolvers:
          # DNS servers used to verify TXT record propagation
          # Using Cloudflare and Google for redundancy
          - "1.1.1.1:53" # Cloudflare primary
          # - "8.8.8.8:53" # Google primary
          # Alternative options:
          # - "1.0.0.1:53"  # Cloudflare secondary
          # - "8.8.4.4:53"  # Google secondary
          # - "9.9.9.9:53"  # Quad9

      # SECURITY: Use ECDSA keys (smaller, faster, more secure than RSA)
      # EC256 provides equivalent security to RSA-3072 but with smaller certificates
      keyType: EC256

      # Optional: Use Let's Encrypt staging for testing to avoid rate limits
      # Uncomment the line below for testing, comment out for production
      # caServer: https://acme-staging-v02.api.letsencrypt.org/directory

# SECURITY: Rate limiting and monitoring
metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true
    buckets:
      - 0.1
      - 0.3
      - 1.2
      - 5.0

# SECURITY: Structured logging with appropriate level
log:
  level: WARN # Changed from INFO to reduce log noise
  filePath: "/var/log/traefik/traefik.log"
  format: json

# SECURITY: Enhanced access logging with privacy considerations
accessLog:
  # filePath: "/var/log/traefik/access.log"
  filePath: "/dev/stdout"
  format: json
  # # SECURITY: Filter sensitive information
  # filters:
  #   statusCodes:
  #     - "400-499"  # Log client errors
  #     - "500-599"  # Log server errors
  #   retryAttempts: true
  #   minDuration: "100ms"
  fields:
    defaultMode: keep
    names:
      # SECURITY: Drop sensitive headers
      Authorization: drop
      Cookie: drop
      Set-Cookie: drop
      # Keep useful headers for debugging
      User-Agent: keep
      Content-Type: keep
      X-Forwarded-For: keep
      X-Real-IP: keep
    headers:
      defaultMode: drop # Changed to drop by default
      names:
        User-Agent: keep
        Content-Type: keep
        X-Forwarded-For: keep
        X-Real-IP: keep

# SECURITY: Disable telemetry
global:
  checkNewVersion: false
  sendAnonymousUsage: false

# SECURITY: Add retry configuration to handle transient failures
retry:
  attempts: 3

# Experimental features - WASM plugin support
experimental:
  plugins:
    coraza:
      moduleName: github.com/jcchavezs/coraza-http-wasm-traefik
      version: v0.3.0
