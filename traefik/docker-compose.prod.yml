services:
  traefik:
    image: docker.io/traefik:v3.0
    container_name: traefik-prod
    restart: unless-stopped
    volumes:
      - ${XDG_RUNTIME_DIR}/podman/podman.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic/prod:/etc/traefik/dynamic:ro
      - ./data:/data
    networks:
      - traefik
    environment:
      - TRAEFIK_LOG_LEVEL=${TRAEFIK_LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Example service - remove if not needed
  hello-world:
    image: docker.io/traefik/whoami
    container_name: hello-world-prod
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello.rule=Host(`hello.werktoej.dk`)"
      - "traefik.http.routers.hello.entrypoints=web,websecure"
      - "traefik.http.routers.hello.tls.certresolver=letsencrypt"
      - "traefik.http.routers.hello.middlewares=security-headers,rate-limit"
      - "traefik.http.services.hello.loadbalancer.server.port=80"
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    external: true
