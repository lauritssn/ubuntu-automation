  whoami:
    image: docker.io/traefik/whoami:${WHOAMI_VERSION:-latest}
    container_name: whoami-dev
    restart: unless-stopped
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    driver: bridge
    external: true
