services:
  traefik:
    image: docker.io/traefik:${TRAEFIK_VERSION:-v3.5.0}
    container_name: traefik-dev
    restart: unless-stopped
    ports:
      - "${TRAEFIK_WEB_PORT:-80}:80"
      - "${TRAEFIK_WEBSECURE_PORT:-443}:443"
      - "${TRAEFIK_DASHBOARD_PORT:-8080}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik-dev.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./data:/data
      - ./logs:/var/log/traefik
    networks:
      - traefik
    environment:
      - APP_DOMAIN=${APP_DOMAIN:-localhost}
      - TRAEFIK_DASHBOARD_DOMAIN=${TRAEFIK_DASHBOARD_DOMAIN:-traefik.localhost}
      - HELLO_WORLD_DOMAIN=${HELLO_WORLD_DOMAIN:-hello.localhost}
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard-dev.rule=Host(`${TRAEFIK_DASHBOARD_DOMAIN:-traefik.localhost}`)"
      - "traefik.http.routers.dashboard-dev.service=api@internal"
      - "traefik.http.routers.dashboard-dev.entrypoints=web"
      - "traefik.http.routers.dashboard-dev.middlewares=dev-headers@file"

  hello-world:
    image: docker.io/traefik/whoami:${WHOAMI_VERSION:-latest}
    container_name: hello-world-dev
    restart: unless-stopped
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.hello-dev.rule=Host(`${HELLO_WORLD_DOMAIN:-hello.localhost}`)"
      - "traefik.http.routers.hello-dev.entrypoints=web"
      - "traefik.http.routers.hello-dev.middlewares=dev-headers@file"

networks:
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    driver: bridge