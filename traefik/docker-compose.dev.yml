services:
  traefik:
    image: docker.io/traefik:${TRAEFIK_VERSION:-v3.1}
    container_name: traefik-dev
    restart: unless-stopped
    ports:
      - 80:80
      - 8080:8080
    volumes:
      - /run/podman/podman.sock:/var/run/docker.sock:ro
      - ./traefik-dev.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic/dev:/etc/traefik/sites/config:ro
      - ./dynamic/shared:/etc/traefik/sites/shared:ro
      - ./data:/data
      - ./logs:/var/log/traefik
      - ".:/plugins-local/src/github.com/acouvreur/traefik-modsecurity-plugin"
    networks:
      - traefik
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

