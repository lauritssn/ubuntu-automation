http:
  routers:
    vaultwarden-prod:
      rule: "Host(`${VAULTWARDEN_URL}`)"
      service: "vaultwarden-prod"
      entryPoints:
        - "websecure"
      tls:
        certResolver: "letsencrypt"
      priority: 90
      middlewares:
        - "security-headers"
        - "vaultwarden-rate-limit"
        - "vaultwarden-headers"
  
  services:
    vaultwarden-prod:
      loadBalancer:
        servers:
          - url: "http://vaultwarden-prod:80"
        healthCheck:
          path: "/alive"
          interval: "30s"
          timeout: "5s"
  
  middlewares:
    vaultwarden-rate-limit:
      rateLimit:
        average: 50
        burst: 100
    
    vaultwarden-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "no-cache, no-store, must-revalidate"
          Pragma: "no-cache"
          Expires: "0" 