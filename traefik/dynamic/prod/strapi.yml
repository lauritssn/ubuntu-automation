http:
  routers:
    strapi-prod:
      rule: "Host(`${APP_DOMAIN}`)"
      service: "strapi-prod"
      entryPoints:
        - "websecure"
      tls:
        certResolver: "letsencrypt"
      priority: 90
      middlewares:
        - "security-headers"
        - "rate-limit"
        - "strapi-headers"
  
  services:
    strapi-prod:
      loadBalancer:
        servers:
          - url: "http://strapi-prod:1337"
        healthCheck:
          path: "/_health"
          interval: "30s"
          timeout: "5s"
  
  middlewares:
    strapi-headers:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host" 