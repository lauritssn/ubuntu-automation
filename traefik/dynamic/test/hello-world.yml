http:
  routers:
    hello-world-test:
      rule: "Host(`hello.localhost`)"
      service: "hello-world-test"
      entryPoints:
        - "web"
      priority: 90
      middlewares:
        - "test-headers@file"
        - "test-rate-limit@file"

  services:
    hello-world-test: 
      loadBalancer:
        servers:
          - url: "http://hello-world-test:80"
        healthCheck:
          path: "/"
          interval: "30s"
          timeout: "5s" 