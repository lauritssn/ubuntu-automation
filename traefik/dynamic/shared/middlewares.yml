    # =============================================================================
    # SECURITY HEADERS MIDDLEWARES
    # =============================================================================

    # Production security headers
    security-headers:
      headers: *security-headers-production

    # Development security headers (relaxed)
    dev-headers:
      headers: *security-headers-development

    # Test security headers (same as development)
    test-headers:
      headers: *security-headers-development

    # =============================================================================
    # RATE LIMITING MIDDLEWARES
    # =============================================================================

    # Production rate limiting
    rate-limit:
      rateLimit: *rate-limit-production

    # Development rate limiting (relaxed)
    dev-rate-limit:
      rateLimit: *rate-limit-development

    # Strict rate limiting for sensitive endpoints
    rate-limit-strict:
      rateLimit: *rate-limit-strict

    # Test rate limiting (relaxed)
    test-rate-limit:
      rateLimit: *rate-limit-development

    # Compression middleware
    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"

    # CORS middleware for APIs - remember to change this for production
    cors-api:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        accessControlAllowOriginList:
          - "*"

    # Basic auth for production dashboard (override users in environment)
    basic-auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_USERS:-admin:$2y$10$2b2cu8Sw4kADVOskOnCpYOBz.qtgHPVBpALBjNpjfw/OaEbWtl4nu}" # admin:changeme

    # Cache headers for static content
    cache-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=3600"

    # No-cache headers for dynamic content
    no-cache-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "no-cache, no-store, must-revalidate"
          Pragma: "no-cache"
          Expires: "0"
