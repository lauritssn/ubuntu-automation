              #             - 'SecRule REQUEST_URI "@rx /wp-admin/customize\.php" "id:2200,phase:1,pass,ctl:ruleRemoveById=941100"'

              #             # Allow WordPress post editing
              #             - 'SecRule REQUEST_URI "@rx /wp-admin/post\.php" "id:2201,phase:1,pass,ctl:ruleRemoveById=941180"'

              #           # Rate limiting configuration
              #           rate_limiting:
              #             # WordPress login rate limiting
              #             - 'SecRule REQUEST_URI "@rx /wp-login\.php" "id:2300,phase:1,pass,setvar:ip.wp_login_burst=+1,deprecatevar:ip.wp_login_burst=10/60,setvar:ip.wp_login_count=+1,deprecatevar:ip.wp_login_count=50/3600"'
              #             - 'SecRule IP:WP_LOGIN_BURST "@gt 10" "id:2301,phase:1,log,deny,status:429,msg:WordPress login burst limit exceeded"'
              #             - 'SecRule IP:WP_LOGIN_COUNT "@gt 50" "id:2302,phase:1,log,deny,status:429,msg:WordPress login hourly limit exceeded"'

              # Engine settings
              "SecRuleEngine DetectionOnly",
              "SecDebugLog /dev/stdout",
              "SecDebugLogLevel 2",
            ]

    # =============================================================================
    # SECURITY HEADERS MIDDLEWARES
    # =============================================================================

    # Production security headers
    security-headers:
      headers: *security-headers-production

    # Development security headers (relaxed)
    dev-headers:
      headers: *security-headers-development

    # Test security headers (same as development)
    test-headers:
      headers: *security-headers-development

    # =============================================================================
    # RATE LIMITING MIDDLEWARES
    # =============================================================================

    # Production rate limiting
    rate-limit:
      rateLimit: *rate-limit-production

    # Development rate limiting (relaxed)
    dev-rate-limit:
      rateLimit: *rate-limit-development

    # Strict rate limiting for sensitive endpoints
    rate-limit-strict:
      rateLimit: *rate-limit-strict

    # Test rate limiting (relaxed)
    test-rate-limit:
      rateLimit: *rate-limit-development

    # Compression middleware
    compress:
      compress:
        excludedContentTypes:
          - "text/event-stream"

    # CORS middleware for APIs - remember to change this for production
    cors-api:
      headers:
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        accessControlMaxAge: 100
        hostsProxyHeaders:
          - "X-Forwarded-Host"
        accessControlAllowOriginList:
          - "*"

    # Basic auth for production dashboard (override users in environment)
    basic-auth:
      basicAuth:
        users:
          - "${TRAEFIK_DASHBOARD_USERS:-admin:$2y$10$2b2cu8Sw4kADVOskOnCpYOBz.qtgHPVBpALBjNpjfw/OaEbWtl4nu}" # admin:changeme

    # Cache headers for static content
    cache-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "public, max-age=3600"

    # No-cache headers for dynamic content
    no-cache-headers:
      headers:
        customResponseHeaders:
          Cache-Control: "no-cache, no-store, must-revalidate"
          Pragma: "no-cache"
          Expires: "0"
