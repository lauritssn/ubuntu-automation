              'SecRule ARGS "@rx (file://|ftp://|gopher://|dict://)" "id:1002,phase:2,log,deny,status:403,msg:Dangerous protocol detected"',
              # WordPress protection
              'SecRule REQUEST_URI "@rx /wp-config\.php" "id:2001,phase:1,log,deny,status:403,msg:WordPress config file access blocked"',
