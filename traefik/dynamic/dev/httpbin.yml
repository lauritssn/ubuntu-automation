http:
  routers:
    httpbin-dev:
      rule: "Host(`httpbin.localdev`)"
      service: "httpbin-dev"
      entryPoints:
        - "web"
      priority: 90
      middlewares:
        - "dev-headers@file"
        - "dev-rate-limit@file"
        - "coraza-waf-dev@file"

  services:
    httpbin-dev:
      loadBalancer:
        servers:
          - url: "http://httpbin-dev:80"
        healthCheck:
          path: "/status/200"
          interval: "30s"
          timeout: "10s"
