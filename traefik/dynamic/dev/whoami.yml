http:
  routers:
    whoami-dev:
      rule: "Host(`whoami.localhost`)"
      service: "whoami-dev"
      entryPoints:
        - "web"
      priority: 90
      middlewares:
        - "dev-headers"
        - "dev-rate-limit"

  services:
    whoami-dev:
      loadBalancer:
        servers:
          - url: "http://whoami-dev:80"
        healthCheck:
          path: "/"
          interval: "30s"
          timeout: "5s" 