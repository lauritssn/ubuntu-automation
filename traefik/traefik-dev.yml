api:
  dashboard: true
  insecure: true  # Simplified dashboard for development

ping: {}

# EntryPoints for development - direct port binding
entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"
  traefik:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik"

  # Dynamic configuration files for development
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Development-specific settings - no HTTPS complexity
log:
  level: DEBUG
  filePath: "/var/log/traefik/traefik.log"

accessLog:
  filePath: "/var/log/traefik/access.log"
  format: common

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    addRoutersLabels: true

