api:
  dashboard: true
  insecure: true

ping: {}

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik"

  # Dynamic configuration files for development
  file:
    directory: /etc/traefik/dynamic/dev
    watch: true

# Development-specific settings
log:
  level: DEBUG

accessLog:
  format: common

# No HTTPS redirect for development
http:
  middlewares:
    # Basic security headers for development
    dev-headers:
      headers:
        frameDeny: false
        browserXssFilter: true
        contentTypeNosniff: true
        customRequestHeaders:
          X-Forwarded-Proto: "http"

    # Relaxed rate limiting for development
    dev-rate-limit:
      rateLimit:
        average: 1000
        burst: 2000
