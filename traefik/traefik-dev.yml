api:
  dashboard: true
  insecure: true

ping: {}

# EntryPoints are configured via environment variables for local development
# Development uses direct port mapping (no socket activation)
# TRAEFIK_ENTRYPOINTS_WEB_ADDRESS=:80
# TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS=:443
# TRAEFIK_ENTRYPOINTS_TRAEFIK_ADDRESS=:8080

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "traefik"

  # Dynamic configuration files for development
  file:
    directory: /etc/traefik/dynamic
    watch: true

# Development-specific settings
log:
  level: ${TRAEFIK_LOG_LEVEL:-DEBUG}

accessLog:
  format: common

